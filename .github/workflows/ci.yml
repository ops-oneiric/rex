name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    # Builds the production image exactly as the server will, so a broken Dockerfile shows up here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rex:ci .
      - name: Image starts and reports healthy
        run: |
          docker run -d --name rex-ci -e REX_ENCRYPTION_KEY="$(openssl rand -base64 32)" -e REX_BACKUPS=off rex:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rex-ci)" = healthy ] && exit 0
            sleep 2
          done
          docker logs rex-ci
          exit 1
