services:
  rex:
    build: .
    restart: unless-stopped
    environment:
      REX_ENCRYPTION_KEY: ${REX_ENCRYPTION_KEY:?Set REX_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - rex-data:/app/data
    # Not published to the host: only Caddy can reach the app.
    expose:
      - "3000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - rex
    environment:
      REX_DOMAIN: ${REX_DOMAIN:?Set REX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rex-data:
  caddy-data:
  caddy-config:
